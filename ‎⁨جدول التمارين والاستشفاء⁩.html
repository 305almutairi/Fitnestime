<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#10242b;--mut:#5b7078;--pool:#0e7c86;--heat:#e8602c;--line:#d3e0e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a1f;--card:#14272e;--ink:#e6f0f2;--mut:#93aab1;--pool:#3cc0cc;--heat:#ff8a5c;--line:#244049}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif}
header{padding:28px 18px 8px;max-width:760px;margin:auto}
h1{font-size:30px;line-height:1.3;margin:0 0 6px;font-weight:700}
header p{margin:0;color:var(--mut)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
nav div{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;max-width:760px;margin:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:6px 16px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:var(--pool);border-color:var(--pool);color:#fff;font-weight:700}
main{max-width:760px;margin:auto;padding:18px}
.day h2{font-size:24px;margin:0}.day .sub{color:var(--mut);margin:0 0 16px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ex summary{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;list-style:none}
.ex summary::-webkit-details-marker{display:none}
.ex summary:focus-visible,nav button:focus-visible{outline:3px solid var(--heat);outline-offset:-3px}
.ico{flex:none;width:84px;height:52px;color:var(--pool);background:var(--bg);border-radius:10px}
.t{flex:1;font-weight:500;line-height:1.4}.t small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.sets{flex:none;font-weight:700;color:var(--heat);font-size:15px;white-space:nowrap}
.body{padding:4px 16px 16px;border-top:1px dashed var(--line)}
.fig{display:block;width:100%;max-width:340px;height:auto;margin:12px auto 0;background:var(--bg);border-radius:12px}.cap{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 10px}
.body ol{margin:0;padding:0 20px}.body li{margin:4px 0}
.rec{margin-top:22px;border-radius:14px;padding:16px;background:linear-gradient(160deg,#0e7c86,#0a4f66);color:#fff}
.rec h3{margin:0 0 8px;font-size:18px}.rec ul{list-style:none;margin:0;padding:0}
.rec li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.2);font-size:15px}
.rec li:last-child{border:0}.rec li span:last-child{opacity:.85;text-align:left}
.rest{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.rest b{color:var(--heat)}
</style>
</head>

function loop(ms){if(!cur||!cur.isConnected)return;draw(cur,(1-Math.cos(ms/1300*Math.PI))/2);raf=requestAnimationFrame(loop)}
view.addEventListener('toggle',e=>{const dt=e.target,f=dt.querySelector&&dt.querySelector('.fig');if(!f)return;
 if(dt.open){view.querySelectorAll('details[open]').forEach(o=>{if(o!==dt)o.open=false});cancelAnimationFrame(raf);cur=f;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)draw(f,1);else raf=requestAnimationFrame(loop)}
 else if(cur===f){cancelAnimationFrame(raf);cur=null}},true);
const today=[6,0,1,2,3,4,5][new Date().getDay()]; // السبت=0
function show(i){
 [...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected',j===i));
 const d=D[i];let h='<section class="day"><h2>'+(d.rest?d.n+': '+d.t:d.n+' — '+d.t)+'</h2><p class="sub">'+d.s+'</p>';
 if(d.rest){h+='<div class="rest"><b>الجمعة: راحة تامة</b><br>بدون تمارين أو سباحة أو ساونا أو بخار أو جاكوزي.</div>'}
 else{
  d.e.forEach(x=>{const st=x[3].split('|');
   h+='<details class="ex"><summary><svg class="ico" role="img" aria-label="'+EQ[x[2]]+'"><use href="#'+x[2]+'"/></svg><span class="t">'+x[0]+'<small>'+EQ[x[2]]+'</small></span><span class="sets">'+x[1]+'</span></summary><div class="body"><svg class="fig" viewBox="0 0 200 160" data-k="'+key(x[0])+'" role="img" aria-label="شرح حركة '+x[0]+'"></svg><p class="cap">الحركة من البداية إلى النهاية وتتكرر تلقائيًا</p><ol>'+st.map(s=>'<li>'+s+'</li>').join('')+'</ol></div></details>';
  });
  h+='<div class="rec"><h3>روتين الاستشفاء اليومي</h3><ul>'+REC.map(r=>'<li><span>'+r[0]+'</span><span>'+r[1]+'</span></li>').join('')+'</ul></div>';
 }
 view.innerHTML=h+'</section>';
 try{history.replaceState(null,'','#d'+i)}catch(e){}
}
D.forEach((d,i)=>{const b=document.createElement('button');b.role='tab';b.textContent=d.n;b.onclick=()=>show(i);tabs.appendChild(b)});
const m=/^#d(\d)$/.exec(location.hash);show(m?+m[1]:today);
</script>
</body>
</html>
